<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0e1117">
<meta name="description" content="Controle financeiro pessoal da Thaynara - despesas, cartões, Pix, dinheiro e empréstimos.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/styles.css">
<title>Finanças da Thay</title>
</head>
<body>

<div id="app">

  <!-- ============ HEADER ============ -->
  <header id="topbar">
    <div class="tb-left">
      <div class="tb-title" id="tbTitle">Início</div>
      <div class="tb-sub" id="tbSub">Olá, Thaynara</div>
    </div>
    <div class="tb-right">
      <button class="icon-btn" id="btnMonthPrev" aria-label="Mês anterior">‹</button>
      <button class="chip-month" id="btnMonth">—</button>
      <button class="icon-btn" id="btnMonthNext" aria-label="Próximo mês">›</button>
    </div>
  </header>

  <!-- ============ VIEWS ============ -->
  <main id="main">
    <section class="view" id="view-home"></section>
    <section class="view" id="view-faturas"></section>
    <section class="view" id="view-emprestimos"></section>
    <section class="view" id="view-relatorios"></section>
    <section class="view" id="view-ajustes"></section>
  </main>

  <!-- ============ FAB ============ -->
  <button id="fab" aria-label="Novo lançamento">
    <svg viewBox="0 0 24 24" width="28" height="28"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
  </button>

  <!-- ============ BOTTOM NAV ============ -->
  <nav id="tabbar">
    <button class="tab active" data-view="home">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Início</span>
    </button>
    <button class="tab" data-view="faturas">
      <svg viewBox="0 0 24 24"><path d="M2 7a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z"/><path d="M2 10h20" stroke="#0e1117" stroke-width="1.6"/></svg>
      <span>Cartões</span>
    </button>
    <span class="tab-spacer"></span>
    <button class="tab" data-view="emprestimos">
      <svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10zM3 22a9 9 0 0 1 18 0z"/></svg>
      <span>Empréstimos</span>
    </button>
    <button class="tab" data-view="relatorios">
      <svg viewBox="0 0 24 24"><path d="M4 20V10h4v10zm6 0V4h4v16zm6 0v-7h4v7z"/></svg>
      <span>Relatórios</span>
    </button>
  </nav>

  <!-- ============ SHEET: LANÇAMENTO ============ -->
  <div class="backdrop" id="backdrop"></div>

  <div class="sheet" id="sheetAdd" aria-hidden="true">
    <div class="sheet-grip"></div>
    <div class="seg" id="segTipo">
      <button class="seg-btn active" data-tipo="despesa">Despesa</button>
      <button class="seg-btn" data-tipo="receita">Receita</button>
    </div>

    <div class="amount-wrap">
      <span class="amount-cur">R$</span>
      <span class="amount" id="amountDisplay">0,00</span>
    </div>
    <div class="amount-hint" id="amountHint"></div>

    <div class="sheet-scroll" id="sheetScroll">

      <div class="field">
        <label>Como pagou?</label>
        <div class="chips" id="chipsMetodo"></div>
      </div>

      <div class="field" id="fieldOrigem">
        <label id="labelOrigem">Onde?</label>
        <div class="chips" id="chipsOrigem"></div>
      </div>

      <div class="field hidden" id="fieldParcelas">
        <label>Parcelas</label>
        <div class="chips" id="chipsParcelas"></div>
        <div class="parcela-info" id="parcelaInfo"></div>
      </div>

      <div class="field">
        <label>Categoria</label>
        <div class="chips wrap" id="chipsCategoria"></div>
      </div>

      <div class="field">
        <label>Quando?</label>
        <div class="chips" id="chipsData"></div>
        <input type="date" id="inputData" class="input mt8">
      </div>

      <div class="field">
        <label>Descrição (opcional)</label>
        <input type="text" id="inputDesc" class="input" placeholder="Ex: mercado do mês" autocomplete="off">
      </div>

      <div class="field" id="fieldFixa">
        <label class="switch-row">
          <span>Repetir todo mês (fixa)</span>
          <input type="checkbox" id="inputFixa" class="switch">
        </label>
      </div>

      <div id="editExtra"></div>
      <div style="height:8px"></div>
    </div>

    <!-- teclado -->
    <div class="keypad" id="keypad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k="c" class="k-alt">C</button><button data-k="0">0</button><button data-k="del" class="k-alt">⌫</button>
    </div>

    <div class="sheet-actions">
      <button class="btn ghost" id="btnCancelAdd">Cancelar</button>
      <button class="btn primary" id="btnSaveAdd">Salvar</button>
    </div>
  </div>

  <!-- ============ SHEET GENÉRICO (modais) ============ -->
  <div class="sheet" id="sheetGen" aria-hidden="true">
    <div class="sheet-grip"></div>
    <div class="gen-head">
      <h3 id="genTitle">Título</h3>
      <button class="icon-btn" id="genClose">✕</button>
    </div>
    <div class="gen-body" id="genBody"></div>
  </div>

  <div id="toast"></div>
</div>

<script src="js/app.js"></script>
</body>
</html>
